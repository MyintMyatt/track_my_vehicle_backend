spring.application.name=track-my-vehicle-backend

server.servlet.context-path=/track-my-vehicle
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB

# Embedded Server (Tomcat) specific limits - defaults can often override the above properties
server.tomcat.max-http-form-post-size=500MB
server.tomcat.max-swallow-size=500MB
#for number of form parameter
server.tomcat.max-part-count=200

spring.profiles.active=dev

spring.datasource.url=jdbc:postgresql://localhost:5432/track-my-vehicle-db
spring.datasource.username=${username}
spring.datasource.password=${password}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.properties.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true


# osm config
app.osm.base-url=https://nominatim.openstreetmap.org

app.osrm.base-url=http://router.project-osrm.org
app.osrm.service=route
app.osrm.version=v1
app.osrm.profile=driving